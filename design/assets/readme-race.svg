<svg xmlns="http://www.w3.org/2000/svg" width="700" height="336" viewBox="0 0 700 336" role="img" aria-label="Concurrent get on 10M UUID keys, 96 threads, AWS c8a, in million operations per second: bbtree 795, scc TreeIndex 132, concurrent-map 81.4, crossbeam SkipMap 62.7, RwLock BTreeMap 19.3; DashMap, unordered, 518.">
  <!-- vis/data/aws-c8a-20261017/throughput.csv: concurrent, uuid, 96 threads, get-half (bbtree: get-half-batch).
       A ball's one-way trip takes 0.6 s × (bbtree's throughput / its throughput). -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 600; fill: #18181b; }
    .title { font-weight: 800; }
    .muted { fill: #52525b; }
    .faint { fill: #71717a; }
    .ours { font-weight: 800; }
    .value { text-anchor: end; }
    .highlight { fill: #ffd60a; }
    .track { stroke: #a1a1aa; stroke-width: 3; stroke-linecap: round; }
    .dashed { stroke-dasharray: 4 6; }
    .ball { animation: bounce linear infinite alternate; }
    @keyframes bounce { to { transform: translateX(310px); } }
  </style>
  <rect x="0.5" y="0.5" width="699" height="335" rx="12" fill="#fafafa" stroke="#d4d4d8"/>

  <text class="title" x="28" y="40">concurrent get, 96 threads</text>
  <text class="muted" x="28" y="66">10M UUID keys · AWS c8a · M ops/s</text>

  <rect class="highlight" x="22" y="86" width="77" height="26" rx="4"/>
  <rect class="highlight" x="631" y="86" width="49" height="26" rx="4"/>
  <text class="ours" x="28" y="106">bbtree</text>
  <line class="track" x1="258" y1="98" x2="590" y2="98"/>
  <circle class="ball" cx="269" cy="98" r="11" fill="#ffd60a" stroke="#18181b" stroke-width="2.5" style="animation-duration: 0.6s"/>
  <text class="ours value" x="672" y="106">795</text>

  <text x="28" y="146">scc TreeIndex</text>
  <line class="track" x1="258" y1="138" x2="590" y2="138"/>
  <circle class="ball" cx="269" cy="138" r="11" fill="#3f3f46" style="animation-duration: 3.61s"/>
  <text class="value" x="672" y="146">132</text>

  <text x="28" y="186">concurrent-map</text>
  <line class="track" x1="258" y1="178" x2="590" y2="178"/>
  <circle class="ball" cx="269" cy="178" r="11" fill="#3f3f46" style="animation-duration: 5.86s"/>
  <text class="value" x="672" y="186">81.4</text>

  <text x="28" y="226">crossbeam SkipMap</text>
  <line class="track" x1="258" y1="218" x2="590" y2="218"/>
  <circle class="ball" cx="269" cy="218" r="11" fill="#3f3f46" style="animation-duration: 7.61s"/>
  <text class="value" x="672" y="226">62.7</text>

  <text x="28" y="266">RwLock&lt;BTreeMap&gt;</text>
  <line class="track" x1="258" y1="258" x2="590" y2="258"/>
  <circle class="ball" cx="269" cy="258" r="11" fill="#3f3f46" style="animation-duration: 24.73s"/>
  <text class="value" x="672" y="266">19.3</text>

  <line class="track dashed" x1="28" y1="282" x2="672" y2="282" stroke-width="1.5"/>

  <text class="faint" x="28" y="314">DashMap (unordered)</text>
  <line class="track dashed" x1="258" y1="306" x2="590" y2="306"/>
  <circle class="ball" cx="269" cy="306" r="11" fill="none" stroke="#71717a" stroke-width="2.5" style="animation-duration: 0.92s"/>
  <text class="faint value" x="672" y="314">518</text>
</svg>
