# The Rust map timed on the C++ benches' workloads (`../workload.hpp`), the
# reference the C++ port's performance is held to. A workspace of its own.
[package]
name = "bbtree-reference-bench"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bbtree = { path = "../../../bbtree" }

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[workspace]
members = ["."]
