[package]
name = "bbtree-vis"
version = "0.0.0"
edition = "2024"
publish = false
description = "Browse a bbtree in the browser, as it stores its nodes."

[dependencies]
bbtree = { path = "..", features = ["inspect"] }
dioxus = { version = "0.7.10", features = ["launch", "logger"] }
# Yields to the browser between chunks of a long build.
gloo-timers = { version = "0.3", features = ["futures"] }
# The browser's clock, for slicing tree builds.
js-sys = "0.3"
# Times builds: `std::time::Instant` panics on wasm32.
web-time = "1"

# Pinned to the wasm-bindgen-cli that the nixpkgs `dx` wraps (`flake.nix`):
# dx refuses any other version.
wasm-bindgen = "=0.2.127"

[features]
default = ["web"]
web = ["dioxus/web"]

# A workspace of its own: Dioxus stays out of the library's dependency graph
# and lockfile, as the fuzzing harnesses do.
[workspace]
members = ["."]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
