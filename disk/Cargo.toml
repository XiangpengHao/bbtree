[package]
name = "bbtree-disk"
version = "0.1.0"
edition = "2024"
description = "bbtree on disk: a compact, read-only map written to a file and looked up where it lies, mapped into memory, at a map's speed."
license = "MIT OR Apache-2.0"
repository = "https://github.com/XiangpengHao/bbtree"
publish = false

[dependencies]
bbtree = { path = "..", features = ["file"] }
memmap2 = "0.9.11"

[dev-dependencies]
# `posix_fadvise`, for the lookups example to drop its file map from the page
# cache, so that mapping it reads it from disk.
libc = "0.2"
mimalloc = "0.1"

# A workspace of its own: the file dependencies stay out of the library's
# dependency graph.
[workspace]
