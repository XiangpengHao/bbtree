name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this exact nightly aligned with flake.nix.
      - name: Install Rust (nightly-2026-10-07)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  bench:
    name: bench (fmt + clippy + test + quick run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4

      # Keep this exact nightly aligned with flake.nix.
      - name: Install Rust (nightly-2026-10-07)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test

      # Keeps the suite building and running as the library's API changes;
      # timings on a shared runner mean nothing.
      - name: Quick run
        run: |
          cargo run --release --bin bbtree-bench -- small --quick
          cargo run --release --bin bbtree-bench-memory -- small --quick

      # CI has no datasets: their cells must be reported as missing data
      # while the rest of the suite runs.
      - name: Quick run without datasets
        env:
          BBTREE_BENCH_DATA: ${{ runner.temp }}/no-bench-data
        run: cargo run --release --bin bbtree-bench -- realkeys tiny --quick --map bbtree

  fuzz:
    name: fuzz harness (fmt + clippy + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@v4

      # Keep this exact nightly aligned with flake.nix.
      - name: Install Rust (nightly-2026-10-07)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      # The structural checks that the fuzz targets call, which only fuzzing
      # builds (`--cfg fuzzing`) compile.
      - name: Clippy (library, fuzzing build)
        working-directory: .
        run: cargo clippy --all-features -- -D warnings
        env:
          RUSTFLAGS: --cfg fuzzing

      - name: Format
        run: cargo fmt --all -- --check

      # `fuzz/.cargo/config.toml` builds with `--cfg fuzzing`, as cargo-fuzz
      # does.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The harnesses on pseudo-random inputs, and every crash kept in
      # `regressions/`. The fuzzing itself runs weekly (fuzz.yml).
      - name: Test
        run: cargo test

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this exact nightly aligned with flake.nix.
      - name: Install Rust (nightly-2026-10-07)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Miri
        run: cargo miri test

      - name: Miri (tree borrows, strict provenance)
        run: cargo miri test
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
