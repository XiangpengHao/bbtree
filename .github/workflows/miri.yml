# Named for its README badge.
name: miri

# The tests under Miri, which reports undefined behavior in the unsafe code.
# Tests that take over about 3 minutes under Miri are ignored under it
# (`#[cfg_attr(miri, ignore = ...)]`), so that this runs on every change;
# normal test runs keep them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a pull request's superseded runs. Every commit on main finishes its
# run, so the README badge reports it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  miri:
    name: miri (tree borrows, strict provenance)
    runs-on: ubuntu-latest
    # The most a job may run on GitHub's runners.
    timeout-minutes: 360
    # Tree borrows rather than Miri's default, stacked borrows; and strict
    # provenance: no integer becomes a pointer.
    env:
      MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v4

      # Keep this exact nightly aligned with flake.nix.
      - name: Install Rust (nightly-2026-10-07)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-07
          components: miri, rust-src

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      # Miri interprets on one core. Nextest runs each test in a process of
      # its own, so as many tests run at once as the runner has cores.
      - name: Miri
        run: cargo miri nextest run --test-threads "$(nproc)"

      # Nextest doesn't run doc tests.
      - name: Miri (doc tests)
        run: cargo miri test --doc
