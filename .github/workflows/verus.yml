# Named for its README badge.
name: verus

# The proofs in bbtree/src/proof/ (design/08-fuzzing-verification.md) and
# bbtree-store's WAL (design/bbtree-store/01-wal.md), checked by Verus, which
# flake.nix pins with the Rust toolchain of its own it needs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a pull request's superseded runs. Every commit on main finishes its
# run, so the README badge reports it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verus:
    name: verus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Verify
        run: nix develop .#verus -c cargo verus verify -p bbtree

      # Its own proofs only: `verify` would check bbtree's again.
      - name: Verify bbtree-store
        run: nix develop .#verus -c cargo verus focus -p bbtree-store
