[package]
name = "bbtree-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bbtree = { path = ".." }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

# A workspace of its own: the fuzzing dependencies stay out of the library's
# dependency graph and lockfile.
[workspace]
members = ["."]

# Line numbers in the sanitizers' stack traces.
[profile.release]
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[[bin]]
name = "map_heap_byte_strings"
path = "fuzz_targets/map_heap_byte_strings.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map_integers"
path = "fuzz_targets/map_integers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map_user_inline_keys"
path = "fuzz_targets/map_user_inline_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map_byte_arrays"
path = "fuzz_targets/map_byte_arrays.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map_plain_keys"
path = "fuzz_targets/map_plain_keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "set_algebra"
path = "fuzz_targets/set_algebra.rs"
test = false
doc = false
bench = false

[[bin]]
name = "user_code_panics"
path = "fuzz_targets/user_code_panics.rs"
test = false
doc = false
bench = false
