# bbtree's maps, used by a crate built for a target for kernels, which has
# no vector registers (x86_64-unknown-none): the maps' code is generic, so
# only a crate that uses them builds it (CI's `build (x86_64-unknown-none)`
# job). A workspace of its own, as the bench and the fuzz targets are.
[package]
name = "bbtree-kernel-target"
version = "0.0.0"
publish = false
edition = "2024"

[dependencies]
bbtree = { path = "..", default-features = false }

[workspace]
members = ["."]
