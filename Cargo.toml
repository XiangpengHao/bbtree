[package]
name = "bbtree"
version = "0.1.0"
edition = "2024"
description = "Blessed B-tree."
license = "MIT OR Apache-2.0"
repository = "https://github.com/XiangpengHao/bbtree"

[dependencies]

[features]
# Read-only views of a map's nodes (`BBTreeMap::inspect`), for the visualizer
# in `vis/`. No stability promise.
inspect = []


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

# Every module with submodules is a folder with its own `mod.rs`, never a
# `foo.rs` beside a `foo/`.
[lints.clippy]
self_named_module_files = "deny"
