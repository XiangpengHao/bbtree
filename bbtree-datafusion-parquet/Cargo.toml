[package]
name = "bbtree-datafusion-parquet"
version = "0.1.4"
edition = "2024"
description = "bbtree-mmap as an index of Parquet files: an index of one or more columns embedded in the file, which DataFusion's Parquet scans look rows up in."
license = "MIT OR Apache-2.0"
repository = "https://github.com/XiangpengHao/bbtree"

[dependencies]
# Released with bbtree and bbtree-mmap, at their version.
bbtree = { path = "../bbtree", version = "0.1.4", features = ["file"] }
bbtree-mmap = { path = "../bbtree-mmap", version = "0.1.4" }
# Arrow, Parquet and the object store come through DataFusion's re-exports,
# so that their versions are always DataFusion's.
# `serde`, for Arrow's time units in an index's schema.
datafusion = { version = "55.2.0", default-features = false, features = ["parquet", "serde"] }
# The morsel API, which `datafusion` doesn't re-export.
datafusion-datasource = { version = "55.2.0", default-features = false }
# Sharing a file's lookup among the partitions that read its ranges.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
datafusion = { version = "55.2.0", default-features = false, features = ["parquet", "serde", "sql"] }
mimalloc = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
