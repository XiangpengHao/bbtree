<svg xmlns="http://www.w3.org/2000/svg" width="800" height="312" viewBox="0 0 800 312" role="img" aria-label="Concurrent get on 10M UUID keys, 96 threads, AWS c8a, in million operations per second: bbtree 795, scc TreeIndex 132, concurrent-map 81.4, crossbeam SkipMap 62.7, RwLock BTreeMap 19.3; DashMap, unordered, 518.">
  <!-- vis/data/aws-c8a-20261017/throughput.csv: concurrent, uuid, 96 threads, get-half (bbtree: get-half-batch).
       A ball's one-way trip takes 0.6 s × (bbtree's throughput / its throughput). -->
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #27272a; }
    .muted { fill: #71717a; }
    .ours { fill: #7a5a00; font-weight: 700; }
    .value { text-anchor: end; }
    .track { stroke: #d4d4d8; stroke-width: 2; }
    .dashed { stroke-dasharray: 3 5; }
    .ball { animation: bounce linear infinite alternate; }
    @keyframes bounce { to { transform: translateX(420px); } }
  </style>
  <rect x="0.5" y="0.5" width="799" height="311" rx="12" fill="#fafafa" stroke="#e4e4e7"/>

  <text x="28" y="40">concurrent get, 96 threads</text>
  <text class="muted" x="772" y="40" text-anchor="end">10M UUID keys · AWS c8a · M ops/s</text>

  <text class="ours" x="28" y="92">bbtree</text>
  <line class="track" x1="200" y1="88" x2="640" y2="88"/>
  <circle class="ball" cx="210" cy="88" r="7" fill="#ffe24a" stroke="#a67c00" stroke-width="1.5" style="animation-duration: 0.6s"/>
  <text class="ours value" x="772" y="92">795</text>

  <text x="28" y="128">scc TreeIndex</text>
  <line class="track" x1="200" y1="124" x2="640" y2="124"/>
  <circle class="ball" cx="210" cy="124" r="7" fill="#59616e" style="animation-duration: 3.61s"/>
  <text class="value" x="772" y="128">132</text>

  <text x="28" y="164">concurrent-map</text>
  <line class="track" x1="200" y1="160" x2="640" y2="160"/>
  <circle class="ball" cx="210" cy="160" r="7" fill="#59616e" style="animation-duration: 5.86s"/>
  <text class="value" x="772" y="164">81.4</text>

  <text x="28" y="200">crossbeam SkipMap</text>
  <line class="track" x1="200" y1="196" x2="640" y2="196"/>
  <circle class="ball" cx="210" cy="196" r="7" fill="#59616e" style="animation-duration: 7.61s"/>
  <text class="value" x="772" y="200">62.7</text>

  <text x="28" y="236">RwLock&lt;BTreeMap&gt;</text>
  <line class="track" x1="200" y1="232" x2="640" y2="232"/>
  <circle class="ball" cx="210" cy="232" r="7" fill="#59616e" style="animation-duration: 24.73s"/>
  <text class="value" x="772" y="236">19.3</text>

  <line class="track dashed" x1="28" y1="256" x2="772" y2="256" stroke-width="1"/>

  <text class="muted" x="28" y="284">DashMap (unordered)</text>
  <line class="track dashed" x1="200" y1="280" x2="640" y2="280"/>
  <circle class="ball" cx="210" cy="280" r="7" fill="none" stroke="#71717a" stroke-width="1.5" style="animation-duration: 0.92s"/>
  <text class="muted value" x="772" y="284">518</text>
</svg>
