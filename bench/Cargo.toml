[package]
name = "bbtree-bench"
version = "0.0.0"
publish = false
edition = "2024"
description = "bbtree's benchmark suite: BBTreeMap against std's maps and hashbrown."
default-run = "bbtree-bench"

[dependencies]
bbtree = { path = ".." }
bytes = "1"
hashbrown = "0.17"
# Pins `bbtree-scaling`'s workers to CPUs (`sched_setaffinity`).
libc = "0.2"
mimalloc = "0.1"
# Runs a cell's untimed setup on all cores; timed regions stay on one thread.
rayon = "1"
# Checks the datasets against the manifest (`verify-data`).
sha2 = "0.10"
# Holds out a dataset's keys by a hash of their bytes that, unlike std's
# `DefaultHasher`, is pinned across Rust releases.
siphasher = "1"
tikv-jemallocator = { version = "0.7", optional = true }

[features]
# Time with jemalloc instead of mimalloc, the default.
jemalloc = ["dep:tikv-jemallocator"]
# The separator census (`bbtree-separator-census`), which reads the map's
# nodes through bbtree's `inspect` views; the timing binaries never enable it.
inspect = ["bbtree/inspect"]

# Times with plain mimalloc.
[[bin]]
name = "bbtree-bench"
path = "src/bin/bbtree-bench.rs"

# Measures memory with a counting allocator around mimalloc: the global
# allocator is fixed at compile time, so the counting one gets its own binary
# and the timing binary pays nothing for it.
[[bin]]
name = "bbtree-bench-memory"
path = "src/bin/bbtree-bench-memory.rs"

# Throughput as threads are added, on maps threads share (`scaling.rs`).
[[bin]]
name = "bbtree-scaling"
path = "src/bin/bbtree-scaling.rs"

# Counts separators and the ties lookups meet in internal nodes, untimed
# (`doc/11-separator-key.md`).
[[bin]]
name = "bbtree-separator-census"
path = "src/bin/bbtree-separator-census.rs"
required-features = ["inspect"]

[profile.release]
# One codegen unit and full LTO, so that inlining doesn't depend on how the
# crate happens to be partitioned; line tables for `perf record`.
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

# jemalloc's configure turns warnings into errors, and under Nix's hardening
# `_FORTIFY_SOURCE` warns at -O0: build it optimized even for `cargo check`.
[profile.dev.package.tikv-jemalloc-sys]
opt-level = 1

# A workspace of its own: the benchmark dependencies stay out of the library's
# dependency graph and lockfile.
[workspace]
members = ["."]
