# Under Miri (`cargo miri nextest run`, which picks the `default-miri`
# profile), only the tests named here run: Miri interprets each test
# thousands of times slower than native code, so it runs the few that reach
# each piece of unsafe code (pages, slots, node splits and merges, inline
# keys, walks, drops and panics, allocators, batch lanes, the latched tree)
# in about a minute each. Other tests don't run under Miri; to add one, name
# it here. The threads tests stay out: optimistic lock coupling reads nodes
# writers are changing, which Miri reports as data races.
[profile.default-miri]
default-filter = """
    test(=tree::teardown::tests::released_pages_build_the_next_tree)
  | test(=tree::teardown::tests::destroy_finishes_after_a_panicking_drop)
  | test(=tree::node::slots::tests::insert_at_every_index)
  | test(=tree::node::slots::tests::remove_at_every_index)
  | test(=tree::node::slots::tests::shifting_strides_moves_whole_entries)
  | test(=tree::node::tests::leaf::split_and_insert_at_every_position)
  | test(=tree::node::tests::leaf::over_aligned_keys_and_values)
  | test(=tree::node::tests::leaf::zero_sized_keys_and_values)
  | test(=tree::node::tests::leaf::search_stays_in_bounds_for_any_ord)
  | test(=tree::node::tests::internal::split_and_insert_at_every_position)
  | test(=tree::node::tests::internal::steals_and_merges_of_leaves)
  | test(=tree::node::tests::internal::steals_and_merges_of_internal_nodes)
  | test(=tree::node::tests::internal::raise_and_lower)
  | test(=tree::node::inline_keys::tests::windows_move_back_like_the_keys)
  | test(=tree::node::inline_key_search::tests::equal_ranges_stay_in_bounds_for_unsorted_inline_keys)
  | test(=tree::node::vector_count::tests::packed_u16_bounds_cover_a_full_mask_word)
  | test(=tree::batch::tests::lookups_match_single_key_finds_at_every_depth)
  | test(=tree::batch::tests::executor_keeps_lanes_pinned_and_drops_each_once)
  | test(=tree::batch::tests::executor_drops_each_lane_once_after_a_lane_panics)
  | test(=unsync::map::tests::length_tag::two_length_candidates_check_hits_and_misses_on_either_side)
  | test(=unsync::map::tests::differential::mutable_walks_of_a_small_tree_match_std)
  | test(=unsync::map::tests::insert::clones_forget_and_moves_keep_the_rightmost_leaf)
  | test(=unsync::map::tests::insert::cached_append_clears_before_callbacks_and_preserves_drop_order)
  | test(=unsync::map::tests::drops::replacing_keeps_the_old_key_and_drops_each_once)
  | test(=unsync::map::tests::drops::a_panicking_new_key_leaves_both_maps_unchanged)
  | test(=unsync::map::tests::drops::a_panicking_drop_while_clearing_matches_std)
  | test(=unsync::map::tests::drops::owning_iterators_drop_like_std)
  | test(=unsync::map::tests::allocator::append_keeps_each_page_with_its_own_allocator)
  | test(=unsync::map::tests::inline_key::wrong_inline_keys_stay_memory_safe)
  | test(=unsync::map::tests::prefix::integer_keys_get_prefixes)
  | test(=unsync::map::tests::batch::empty_single_and_repeated_keys)
  | test(=unsync::map::tests::batch::replaced_and_stored_values_drop_once)
  | test(=map::tests::a_small_map_matches_std)
"""
